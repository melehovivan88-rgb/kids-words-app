<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kids Words</title>
<meta name="theme-color" content="#2F5BEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kids Words">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="icon" href="icon-192.png?v=2">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Nunito:wght@400;600;700;800&family=Noto+Sans:wght@400;500&display=swap">
<style>
/* Layout: one narrow column like a school notebook page on squared paper; app screens swap in place */
:root{
--paper:#F5F7FC; --grid:rgba(29,42,91,.06); --card:#FFFFFF; --ink:#1D2A5B; --muted:#5D678A; --line:#DCE1EE;
--primary:#2F5BEA; --primary-ink:#FFFFFF; --primary-soft:#E6ECFD;
--sun:#F5B21B; --sun-soft:#FFF3D3; --sun-ink:#6B4A00;
--good:#1C9466; --good-soft:#DDF4EA; --bad:#D9443A; --bad-soft:#FBE3E1;
--c1:#2F5BEA; --c2:#D9443A; --c3:#1C9466; --c4:#E08A00; --c5:#7C4DDB; --c6:#0E97A8;
--f-display:"Unbounded","Nunito",system-ui,sans-serif;
--f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
--f-ipa:"Noto Sans","Segoe UI","Arial Unicode MS",sans-serif;
--r:16px; --shadow:0 1px 0 rgba(29,42,91,.08),0 6px 18px -10px rgba(29,42,91,.25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
--paper:#10142A; --grid:rgba(232,236,250,.05); --card:#1A2042; --ink:#E8ECFA; --muted:#9AA3C7; --line:#2C3463;
--primary:#7393FF; --primary-ink:#0E1430; --primary-soft:#232C5C;
--sun:#FFCB4D; --sun-soft:#3A3014; --sun-ink:#FFE19A;
--good:#3CC48E; --good-soft:#163A2D; --bad:#FF6F64; --bad-soft:#47201E;
--shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
--paper:#10142A; --grid:rgba(232,236,250,.05); --card:#1A2042; --ink:#E8ECFA; --muted:#9AA3C7; --line:#2C3463;
--primary:#7393FF; --primary-ink:#0E1430; --primary-soft:#232C5C;
--sun:#FFCB4D; --sun-soft:#3A3014; --sun-ink:#FFE19A;
--good:#3CC48E; --good-soft:#163A2D; --bad:#FF6F64; --bad-soft:#47201E;
--shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6); color-scheme:dark}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
background-size:22px 22px;padding-inline:16px;padding-block:12px 40px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.55rem} h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)}
.ipa{font-family:var(--f-ipa);color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.label{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.brand i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--primary);color:var(--primary-ink);font-style:normal;font-size:.8rem}
.coins{display:inline-flex;align-items:center;gap:6px;background:var(--sun-soft);color:var(--sun-ink);border-radius:999px;padding:6px 12px 6px 8px;font-weight:800}
.coins svg{width:20px;height:20px}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--muted);padding:6px 8px 6px 0}
.back svg{width:20px;height:20px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:800;background:var(--primary);color:var(--primary-ink);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--primary-soft);color:var(--primary)}
.btn.plain{background:transparent;color:var(--muted);min-height:40px;padding:0 10px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.wide{width:100%}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--primary);background:var(--primary-soft);flex:none}
.icon-btn svg{width:22px;height:22px}
.icon-btn.sm{width:34px;height:34px;border-radius:10px}
.icon-btn.sm svg{width:18px;height:18px}
.icon-btn.quiet{background:transparent;color:var(--muted)}
/* panels */
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.field{width:100%;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;outline:none}
.field:focus{border-color:var(--primary)}
textarea.field{min-height:110px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row > .grow{flex:1 1 160px;min-width:0}
/* home */
.hello{display:flex;flex-direction:column;gap:4px}
.today{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;background:var(--card);box-shadow:var(--shadow)}
.cats{display:grid;gap:12px}
.cat{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.cat .badge{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.cat .info{min-width:0;display:flex;flex-direction:column;gap:6px}
.cat .name{font-weight:800;font-size:1.08rem;overflow-wrap:anywhere}
.cat .meta{font-size:.85rem;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar > span{display:block;height:100%;border-radius:99px;background:var(--good)}
.cat .pts{font-weight:800;color:var(--sun-ink);background:var(--sun-soft);border-radius:10px;padding:4px 8px;font-size:.9rem}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 3px var(--card)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty .muted{max-width:34ch}
/* category header & tabs */
.cathead{display:flex;align-items:center;gap:12px}
.cathead .badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;flex:none}
.cathead h1{font-size:1.3rem;overflow-wrap:anywhere;min-width:0;flex:1}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--shadow);gap:2px}
.tabs button{padding:10px 4px;border-radius:10px;font-weight:800;font-size:.88rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--primary);color:var(--primary-ink)}
/* words list */
.words{display:flex;flex-direction:column;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.word{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.word:first-child{border-top:0}
.word.fresh{background:var(--sun-soft)}
.word .w{min-width:0}
.word .en{font-weight:800;font-size:1.08rem;overflow-wrap:anywhere}
.word .ru{overflow-wrap:anywhere}
.word .ru.wait{color:var(--muted);font-style:italic}
.word .ipa{font-size:.9rem;margin-left:6px}
.stars{display:inline-flex;gap:1px;color:var(--line)}
.stars .on{color:var(--sun)}
.stars svg{width:14px;height:14px}
.edit{display:grid;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--primary-soft)}
.note{font-size:.9rem;border-radius:12px;padding:10px 12px;background:var(--primary-soft)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.spinner{width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
/* learn card */
.flash{background:var(--card);border-radius:22px;box-shadow:var(--shadow);min-height:260px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;position:relative}
.flash .big{font-family:var(--f-display);font-size:clamp(1.8rem,8vw,2.6rem);font-weight:700;overflow-wrap:anywhere;line-height:1.15}
.flash .ipa{font-size:1.2rem}
.flash .tr{font-size:1.3rem;font-weight:800;color:var(--good);min-height:1.8em;overflow-wrap:anywhere}
.flash .reveal{color:var(--primary);font-weight:800;padding:8px 14px;border-radius:12px;background:var(--primary-soft)}
.flash .count{position:absolute;top:12px;right:16px;font-size:.85rem;color:var(--muted);font-weight:700}
.say{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--primary-ink)}
.say svg{width:30px;height:30px}
.say.huge{width:110px;height:110px}
.say.huge svg{width:52px;height:52px}
.learnnav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* check modes */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;min-width:0}
.mode b{font-size:1.02rem}
.mode span{font-size:.86rem;color:var(--muted)}
.mode em{font-style:normal;font-weight:800;color:var(--sun-ink);font-size:.82rem}
.mode[disabled]{opacity:.45;cursor:not-allowed}
.mode .mi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.mode .mi svg{width:20px;height:20px}
/* quiz */
.qtop{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.qbar{height:10px;border-radius:99px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.qbar span{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.qcard{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qcard .ask{font-weight:700;color:var(--muted)}
.qcard .big{font-family:var(--f-display);font-size:clamp(1.6rem,7.5vw,2.3rem);font-weight:700;overflow-wrap:anywhere;line-height:1.2}
.opts{display:grid;gap:10px}
.opt{min-height:56px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:1.08rem;padding:10px 14px;border:2px solid transparent;overflow-wrap:anywhere}
.opt.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt[disabled]{cursor:default}
.spell{display:flex;flex-direction:column;gap:10px}
.spell .field{font-size:1.3rem;text-align:center;font-weight:800;letter-spacing:.04em}
.spell .field.ok{border-color:var(--good);background:var(--good-soft)}
.spell .field.no{border-color:var(--bad);background:var(--bad-soft)}
.hint{font-family:var(--f-ipa);font-size:1.2rem;letter-spacing:.25em;color:var(--muted)}
.fb{border-radius:16px;padding:12px 14px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .ans{color:var(--ink);font-weight:800}
.plus{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
/* result */
.result{text-align:center;align-items:center}
.result .score{font-family:var(--f-display);font-size:3rem;font-weight:700;color:var(--sun-ink);background:var(--sun-soft);border-radius:20px;padding:8px 22px}
/* progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-display);font-size:1.35rem}
.tile span{font-size:.8rem;color:var(--muted);font-weight:700}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.chart .val{fill:var(--ink);font-weight:800}
.sess{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;font-size:.92rem;align-items:center}
.sess .acc{font-weight:800}
.wstat{display:grid;grid-template-columns:1fr auto auto;gap:8px 12px;align-items:center;font-size:.95rem}
.wstat .en{font-weight:800;overflow-wrap:anywhere;min-width:0}
.legend{font-size:.82rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);z-index:9;box-shadow:var(--shadow)}
.loading{display:grid;place-items:center;gap:10px;padding:60px 0;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.sync.wait .dot{background:var(--sun)}
.sync.err .dot{background:var(--bad)}
.why{font-size:.75rem;color:var(--muted);overflow-wrap:anywhere}
/* pictures and russian pronunciation hint */
.em{font-size:1.6rem;line-height:1;flex:none;width:34px;text-align:center}
.rusay{color:var(--primary);font-weight:700}
.word .rusay{font-size:.88rem;margin-left:6px}
.word .w .em{font-size:1.25rem;width:auto;margin-right:6px;vertical-align:-2px}
.pic{font-size:clamp(3.4rem,18vw,4.6rem);line-height:1.1}
.flash .rusay,.qcard .rusay{font-size:1.15rem}
.saybar{display:flex;gap:12px;justify-content:center;align-items:center}
.say.slow{width:52px;height:52px;background:var(--primary-soft);color:var(--primary);font-size:1.5rem}
.tellme{background:var(--sun-soft);color:var(--sun-ink);border-radius:12px;padding:8px 14px;font-weight:800}
/* learn hub */
.hub{display:flex;flex-direction:column;gap:12px}
.bigbtn{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border-radius:18px;padding:16px;background:var(--primary);color:var(--primary-ink);box-shadow:var(--shadow);min-height:76px}
.bigbtn.sun{background:var(--sun);color:#3A2800}
.bigbtn .ico{font-size:2rem;line-height:1;flex:none}
.bigbtn b{display:block;font-size:1.12rem;font-family:var(--f-display);font-weight:700}
.bigbtn small{display:block;font-weight:700;opacity:.85;font-size:.88rem}
.bigbtn[disabled]{opacity:.5;cursor:not-allowed}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stage{font-size:.8rem;font-weight:800;color:var(--primary);background:var(--primary-soft);border-radius:999px;padding:3px 10px}
/* build from letters */
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.slot{width:38px;height:46px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;font-weight:800;font-size:1.35rem;background:var(--card)}
.slot.on{border-style:solid;border-color:var(--primary);color:var(--primary)}
.slot.gap{border:0;width:14px;background:none}
.slots.ok .slot.on{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.slots.no .slot.on{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.tilesrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ltile{width:48px;height:52px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:1.4rem;border:2px solid var(--line)}
.ltile:active{transform:scale(.94)}
.ltile.used{visibility:hidden}
</style></head><body>

<script>
(function(){
"use strict";
/* ---------- icons ---------- */
const I = {

star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.8 6.3.8-4.6 4.4 1.2 6.3L12 17.1 6.3 20.1l1.2-6.3L2.9 9.4l6.3-.8z"/></svg>',

pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 16l9-9 3 3-9 9H6z"/></svg>',
mix:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l10 10h3M4 17h3l3-3M14 10l3-3h3M18 4l2 3-2 3M18 14l2 3-2 3"/></svg>'
};
/* ---------- helpers ---------- */
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const dayKey = (d=new Date()) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const norm = s => String(s||'').toLowerCase().replace(/[’']/g,"'").replace(/[^a-zа-яё' -]/g,'').replace(/\s+/g,' ').trim();

const label = x => k === 'pick_ru' ? norm(x.ru) : norm(x.en);

for (const x of shuffle(pool).concat(shuffle(extra))){
if (out.length >= 4) break;
if (x.id === w.id) continue;
const L = label(x);
if (!L || seen.has(L)) continue;
if (norm(x.en) === norm(w.en) || norm(x.ru) === norm(w.ru)) continue;
seen.add(L); out.push(x);

}

const it = Object.assign({ k, wid:w.id, cid:w.cid }, extra || {});
if (k === 'pick_ru' || k === 'pick_en' || k === 'listen') it.opts = makeOpts(w, k, pool);

if (q.state === 'no') h += `<div class="fb no"><span>Правильно: <span class="ans">${esc(it.k==='pick_ru'?w.ru:w.en)}</span>${it.k!=='pick_ru'?` <span class="ipa">${esc(w.ipa||'')}</span> ${ruSay(w)}`:''}</span><button class="btn" data-act="next" data-autofocus>Дальше</button></div>`;
return h;
}
function optsHTML(q, it, label){
return `<div class="opts">` + it.opts.map(id => {
let cls = '';
if (q.state){ if (id===it.wid) cls='ok'; else if (id===q.chosen) cls='no'; }
return `<button class="opt ${cls}" data-act="answer" data-id="${id}" ${q.state?'disabled':''}>${esc(label(id)||'—')}</button>`;
}).join('') + `</div>`;
}
const PTS = { lesson:{ pick_ru:5, listen:5, build:5, spell:5 }, review:{ pick_ru:10, pick_en:10, listen:10, build:10, spell:15 } };
function answer(ok, pts){
const q = S.quiz; const it = q.items[q.i];
if (q.mode === 'lesson' || q.mode === 'review') pts = PTS[q.mode][it.k] || 10;
if (it.k === 'spell' && q.hint) pts = Math.min(pts, 10);
if (it.retry) pts = 0;
q.state = ok ? 'ok' : 'no'; q.lastPts = ok ? pts : 0;
if (ok){ q.right++; q.points += pts; }
const cid = it.cid || q.catId;
const bc = q.byCat[cid] || (q.byCat[cid] = { r:0, n:0, p:0 });
bc.n++; if (ok){ bc.r++; bc.p += pts; }
const p = clone(prog(cid)); p.words = p.words||{}; p.days = p.days||{}; p.sessions = p.sessions||[];
const s = p.words[it.wid] || (p.words[it.wid] = { r:0, w:0 });
if (typeof s.b !== 'number') s.b = boxOf(s);
if (ok){ s.r++; if (pts){ p.points = (p.points||0) + pts; p.days[dayKey()] = (p.days[dayKey()]||0) + pts; } }
else { s.w++; }
/* коробочки: в уроке слова только знакомятся; в повторении и проверках — растут или откатываются */
if (q.mode !== 'lesson' && !it.retry){
if (ok){ if (s.b === 0 || isDue(s)) promote(s); }
else demote(s);
}
save('progress', cid, p);
/* ошибся в уроке или повторении — это же слово ещё раз в конце */
if (!ok && (q.mode === 'lesson' || q.mode === 'review') && (it.tries||0) < 2){
const w = wordById(it.wid);
if (w){ const pool = usable(cat(w.cid) || { words:[] }).map(x => Object.assign({ cid:w.cid }, x));
q.items.push(makeItem(w, it.k, pool, { stage:it.stage, sn:it.sn, st:it.st, retry:true, tries:(it.tries||0)+1 })); }
}
render();
const w = quizWord(q, it.wid);
if (ok && it.k !== 'listen' && w.en) speak(w.en);
if (ok && it.k !== 'spell' && it.k !== 'build') setTimeout(()=>{ if (S.quiz===q && q.state==='ok') nextQ(); }, 1200);
}
function autoSay(q){
const it = q.items[q.i]; if (!it) return;
const w = quizWord(q, it.wid);
if ((it.k === 'listen' || it.k === 'intro') && w.en) speak(w.en);
const nx = q.items[q.i+1]; if (nx) preloadWord(quizWord(q, nx.wid));
}
function nextQ(){
const q = S.quiz;
if (q.i + 1 >= q.items.length){ q.done = true; finishQuiz(); return; }
q.i++; q.state=null; q.chosen=null; q.typed=''; q.hint=false; q.built=[];
render(); window.scrollTo(0,0);
autoSay(q);
}
function finishQuiz(){
const q = S.quiz;
stopSound();
const answered = Object.values(q.byCat).reduce((s,x) => s + x.n, 0);
for (const [cid, x] of Object.entries(q.byCat)){
if (!data.cats[cid]) continue;
const p = clone(prog(cid)); p.sessions = p.sessions||[];
p.sessions.push({ t:Date.now(), m:q.mode, r:x.r, n:x.n, p:x.p });
if (p.sessions.length > 60) p.sessions = p.sessions.slice(-60);
save('progress', cid, p);
}
/* урок пройден до конца — слова отправляются в первую коробочку, повторение завтра */
if (q.mode === 'lesson' && q.done && q.catId && data.cats[q.catId]){
const p = clone(prog(q.catId)); p.words = p.words||{};
q.lessonIds.forEach(id => { const s = p.words[id] || (p.words[id] = { r:0, w:0 }); if (boxOf(s) === 0){ s.b = 1; s.due = addDays(1); } });
save('progress', q.catId, p);
}
q.answered = answered;
S.view = 'result'; render(); window.scrollTo(0,0);
}
function viewResult(){
const q = S.quiz; const n = q.answered || 0; const pct = n ? q.right/n : 0;
let title = !n ? 'Готово' : pct===1 ? 'Без единой ошибки!' : pct>=.8 ? 'Отлично!' : pct>=.5 ? 'Хорошо, продолжай!' : 'Нужно ещё потренироваться';
let sub = n ? `Верно ${q.right} из ${n}` : '';
let again = `<button class="btn" data-act="again">Ещё раз</button>`;
if (q.mode === 'lesson'){
if (q.done){ title = 'Урок пройден! 🎉'; sub = `Новых слов: ${q.lessonIds.length}. Повторим их завтра.`; }
const c = cat(q.catId);
again = c && newWords(c).length ? `<button class="btn" data-act="again">Следующий урок</button>` : '';
}
if (q.mode === 'review'){
if (q.done) title = pct >= .8 || !n ? 'Повторение готово! 🎉' : 'Повторение готово';
const left = q.catId ? (cat(q.catId) ? dueWords(cat(q.catId)).length : 0) : allDue();
again = left ? `<button class="btn" data-act="again">Повторить ещё ${left}</button>` : '';
}
const back = q.catId ? `<button class="btn ghost" data-act="tocat">К категории</button>` : `<button class="btn ghost" data-act="home">На главную</button>`;
return `<div class="panel result" style="padding:28px 18px;gap:14px"><span class="label">${esc(MODES[q.mode].t)}</span><h1>${title}</h1>
<div class="score num">+${q.points}</div>${sub?`<p class="muted num">${esc(sub)}</p>`:''}
<div class="row" style="justify-content:center">${again}${back}</div></div>`;
}

/* ---------- adding words: instantly on screen, translation in the background ---------- */
/* Основной путь: облачная функция (Яндекс Переводчик + кеш). Запасной: напрямую из браузера с короткими таймаутами. */
async function directTranslate(text, from, to){
try{
const u = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl='+from+'&tl='+to+'&dt=t&q='+encodeURIComponent(text);
const j = await (await fetchT(u, {}, 4000)).json();
const t = (j[0]||[]).map(x=>x && x[0] || '').join('').trim();
if (t) return t;
}catch(e){}
try{
const u = 'https://api.mymemory.translated.net/get?langpair='+from+'|'+to+'&q='+encodeURIComponent(text);
const j = await (await fetchT(u, {}, 4000)).json();
const t = j && j.responseData && j.responseData.translatedText;
if (t && !/MYMEMORY WARNING/i.test(t)) return String(t).trim();
}catch(e){}
return '';
}
async function directPhonetics(en){
try{
const r = await fetchT('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(en), {}, 3000);
if (!r.ok) return { ipa:'', au:'' };
const entries = await r.json();
let ipaUk='', ipaAny='', auUk='', auAny='';
entries.forEach(e => {
if (!ipaAny && e.phonetic) ipaAny = e.phonetic;
(e.phonetics||[]).forEach(p => {
const uk = /-uk\.mp3$/.test(p.audio||'');
if (p.text){ if (uk && !ipaUk) ipaUk = p.text; if (!ipaAny) ipaAny = p.text; }
if (p.audio){ if (uk && !auUk) auUk = p.audio; if (!auAny) auAny = p.audio; }
});
});
const ipa = (ipaUk||ipaAny).replace(/^[\/\[]\s*|\s*[\/\]]$/g,'');
return { ipa: ipa ? '['+ipa+']' : '', au: auUk||auAny };
}catch(e){ return { ipa:'', au:'' }; }
}
async function directOne(src){
let en = src, ru = '';
if (CYR.test(src)){ ru = src; en = (await directTranslate(src, 'ru', 'en')).split(',')[0].trim(); if (!/^I\b/.test(en)) en = en.toLowerCase(); }
else { ru = await directTranslate(src, 'en', 'ru'); if (src === src.toLowerCase() && ru) ru = ru.charAt(0).toLowerCase() + ru.slice(1); }
const ph = en ? await directPhonetics(en) : { ipa:'', au:'' };
return { src, en, ru, ipa:ph.ipa, au:ph.au };
}
async function lookup(list){
try{
const j = await api('lookup', { words:list }, 15000);
if (j && Array.isArray(j.items)) return j.items;
}catch(e){}
const out = [];
for (let i=0;i<list.length;i+=8) out.push(...await Promise.all(list.slice(i,i+8).map(directOne)));
return out;
}
async function addWords(text){
const catId = S.catId; const c = cat(catId);
const have = new Set((c.words||[]).map(w=>norm(w.en||w.ru)));
const list = [...new Set(text.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean))].filter(s=>!have.has(norm(s))).slice(0,120);
if (!list.length){ S.addNote = { text:'Эти слова уже есть в категории.' }; render(); return; }
const ids = {};
updateCatById(catId, b => {
b.words = b.words || [];
list.forEach(src => { const id = uid(); ids[src] = id; const ru = CYR.test(src);
b.words.push({ id, en: ru ? '' : src, ru: ru ? src : '', ipa:'', au:'', pend:1 }); });
});
S.draft = ''; S.fresh = Object.values(ids);
S.addNote = { text:`Добавлено: ${list.length} ${plural(list.length,'слово','слова','слов')}. Подставляю перевод…` };
render();
let items = [];
try{ const r = await Promise.all([lookup(list), loadEmoji()]); items = r[0]; }catch(e){}
const bySrc = {}; items.forEach(it => { if (it && it.src) bySrc[it.src] = it; });
let missing = 0;
updateCatById(catId, b => {
const seen = new Set();
b.words = (b.words||[]).filter(w => {
const src = Object.keys(ids).find(s => ids[s] === w.id);
if (src !== undefined && w.pend){
const it = bySrc[src] || {};
if (it.en) w.en = it.en;
if (it.ru) w.ru = it.ru;
if (it.ipa && !w.ipa) w.ipa = it.ipa;
if (it.au) w.au = it.au;
if (EMOJI && w.en) w.em = emojiFor(w.en);
delete w.pend;
if (!w.en || !w.ru) missing++;
}
const k = norm(w.en || w.ru);
if (k && seen.has(k)) return false;
seen.add(k); return true;
});
});
S.addNote = missing
? { text:`Для ${missing} ${plural(missing,'слова','слов','слов')} перевод не нашёлся. Нажмите карандаш и впишите вручную.`, bad:true }
: { text:'Готово! Проверьте перевод, при ошибке нажмите на карандаш.' };
refresh();
}
function updateCatById(catId, fn){ const cur = cat(catId); if (!cur) return; const { id, ...body } = clone(cur); fn(body); save('cats', id, body); }
function updateCat(fn){ updateCatById(S.catId, fn); }
/* ---------- events ---------- */
$app.addEventListener('input', e => { if (e.target.id === 'draft') S.draft = e.target.value; if (e.target.id === 'spell' && S.quiz) S.quiz.typed = e.target.value; });
$app.addEventListener('submit', e => {
e.preventDefault(); const f = e.target, kind = f.dataset.form, fd = new FormData(f);
if (kind === 'newcat'){ const name = String(fd.get('name')||'').trim(); if (!name){ toast('Введите название категории'); return; }
const id = uid(); save('cats', id, { name, color:S.newColor, createdAt:Date.now(), words:[] }); S.newCat=false; S.catId=id; S.view='cat'; S.tab='words'; S.draft=''; S.addNote=null; S.fresh=[]; render(); }
if (kind === 'add'){ const t = String(fd.get('draft')||'').trim(); if (!t){ toast('Впишите хотя бы одно слово'); return; } document.activeElement && document.activeElement.blur(); addWords(t); }
if (kind === 'manual'){ const en=String(fd.get('en')||'').trim(), ru=String(fd.get('ru')||'').trim(), ipa=String(fd.get('ipa')||'').trim();
if (!en || !ru){ toast('Нужны слово и перевод'); return; }
if ((cat(S.catId).words||[]).some(w=>norm(w.en)===norm(en))){ toast('Такое слово уже есть'); return; }
const id = uid(); updateCat(b => { b.words = b.words||[]; b.words.push(EMOJI ? { id, en, ru, ipa, em:emojiFor(en) } : { id, en, ru, ipa }); }); S.fresh=[id]; f.reset(); render(); }
if (kind === 'edit'){ const wid = f.dataset.id; const en=String(fd.get('en')||'').trim(), ru=String(fd.get('ru')||'').trim(), ipa=String(fd.get('ipa')||'').trim(), em=String(fd.get('em')||'').trim();
if (!en){ toast('Слово не может быть пустым'); return; }
updateCat(b => { const w = b.words.find(x=>x.id===wid); if (w){ const enChanged = w.en !== en; if (enChanged) w.au=''; w.em = (enChanged && em === (w.em||'')) ? (EMOJI ? emojiFor(en) : undefined) : em; w.en=en; w.ru=ru; w.ipa=ipa; delete w.pend; } }); S.editId=null; S.confirm=null; render(); }
if (kind === 'rename'){ const name = String(fd.get('name')||'').trim(); if (!name) return; updateCat(b=>{ b.name=name; }); document.activeElement && document.activeElement.blur(); toast('Название сохранено'); render(); }
if (kind === 'spell'){ const q = S.quiz; if (q.state) return; const w = quizWord(q, q.items[q.i].wid);
const typed = norm(q.typed); if (!typed){ toast('Напиши слово'); return; }
const syn = allUsable().some(x => x.id !== w.id && norm(x.ru) === norm(w.ru) && norm(x.en) === typed);
answer(typed === norm(w.en) || syn, q.hint ? 10 : 15); }
if (kind === 'manual' || kind === 'edit') setTimeout(() => backfill(), 0);
});
$app.addEventListener('click', e => {
const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
const a = b.dataset.act;
if (a !== 'delword' && a !== 'delcat' && a !== 'resetprog') S.confirm = null;
switch (a){
case 'say': if (b.dataset.t) speak(b.dataset.t); return;
case 'sayslow': if (b.dataset.t) speak(b.dataset.t, true); return;
case 'home': S.view='home'; S.catId=null; render(); window.scrollTo(0,0); return;
case 'open': S.catId=b.dataset.id; S.view='cat'; S.tab='words'; S.browse=false; S.draft=''; S.addNote=null; S.fresh=[]; S.editId=null; S.learnIdx=0; S.learnShow=false; S.learnOrder=null; S.manual=false; render(); window.scrollTo(0,0); return;
case 'newcat': S.newCat=true; S.newColor=Object.keys(data.cats).length%COLORS.length; render(); return;
case 'cancelcat': S.newCat=false; render(); return;
case 'color': S.newColor=+b.dataset.i; $app.querySelectorAll('[data-act="color"]').forEach(x=>x.setAttribute('aria-pressed', x===b)); return;
case 'recolor': updateCat(c=>{ c.color=+b.dataset.i; }); render(); return;
case 'tab': S.tab=b.dataset.tab; S.editId=null; S.learnShow=false; S.browse=false; render(); return;
case 'browse': S.browse=true; S.learnShow=false; render(); return;
case 'unbrowse': S.browse=false; render(); return;
case 'manual': S.manual=!S.manual; render(); return;
case 'editword': S.editId=b.dataset.id; render(); return;
case 'canceledit': S.editId=null; render(); return;
case 'delword': if (S.confirm!=='w'+b.dataset.id){ S.confirm='w'+b.dataset.id; render(); return; }
updateCat(c=>{ c.words=c.words.filter(w=>w.id!==b.dataset.id); }); S.editId=null; S.confirm=null; render(); return;
case 'delcat': if (S.confirm!=='delcat'){ S.confirm='delcat'; render(); return; }
save('cats', S.catId, DEL); if (data.progress[S.catId]) save('progress', S.catId, DEL); S.confirm=null; S.view='home'; S.catId=null; render(); return;
case 'resetprog': if (S.confirm!=='reset'){ S.confirm='reset'; render(); return; }
save('progress', S.catId, { points:0, words:{}, days:{}, sessions:[] }); S.confirm=null; toast('Прогресс сброшен'); render(); return;
case 'reveal': S.learnShow=true; render(); return;
case 'lnext': case 'lprev': { const n=usable(cat(S.catId)).length; if (!n) return; S.learnIdx=(S.learnIdx+(a==='lnext'?1:-1)+n)%n; S.learnShow=false; render();
const w=cat(S.catId).words.find(x=>x.id===S.learnOrder[S.learnIdx]); if (w && w.en) speak(w.en); return; }
case 'lshuffle': S.learnOrder=shuffle(S.learnOrder||[]); S.learnIdx=0; S.learnShow=false; render(); return;
case 'start': case 'again': case 'lesson': case 'review': {
let q;
if (a === 'lesson' || (a === 'again' && S.quiz.mode === 'lesson')) q = buildLesson(cat(S.catId));
else if (a === 'review') q = buildReview(b.dataset.id || null);
else if (a === 'again' && S.quiz.mode === 'review') q = buildReview(S.quiz.catId);
else q = buildQuiz(cat(S.catId), a === 'again' ? S.quiz.mode : b.dataset.mode);
if (!q.items.length){ toast('Сейчас нечего повторять'); return; }
if (a === 'review' && b.dataset.id) S.catId = b.dataset.id;
S.quiz = q; S.view='quiz'; render(); window.scrollTo(0,0); autoSay(q); return; }
case 'introok': { const q=S.quiz; if (q.items[q.i].k!=='intro') return; nextQ(); return; }
case 'tile': { const q=S.quiz, it=q.items[q.i]; if (q.state || it.k!=='build') return; const i=+b.dataset.i; if (q.built.includes(i)) return;
q.built.push(i);
if (q.built.length === it.tiles.length){ const w = quizWord(q, it.wid); const made = q.built.map(x=>it.tiles[x]).join(''); answer(made === w.en.toLowerCase().replace(/ /g,''), 10); }
else render();
return; }
case 'untile': { const q=S.quiz; if (q.state) return; q.built.pop(); render(); return; }
case 'answer': { const q=S.quiz; if (q.state) return; q.chosen=b.dataset.id; answer(q.chosen===q.items[q.i].wid, 10); return; }
case 'hint': S.quiz.hint=true; render(); return;
case 'next': nextQ(); return;
case 'quit': finishQuiz(); return;
case 'tocat': S.view='cat'; S.tab = (S.quiz && (S.quiz.mode==='lesson'||S.quiz.mode==='review')) ? 'learn' : 'stats'; render(); window.scrollTo(0,0); return;
}
});

function seedExample(){
try{ if (localStorage.getItem('slovarik-seeded')) return; localStorage.setItem('slovarik-seeded','1'); }catch(e){ return; }
const words = [['cat','кошка','[kæt]'],['dog','собака','[dɒɡ]'],['rabbit','кролик','[ˈræbɪt]'],['horse','лошадь','[hɔːs]'],['bird','птица','[bɜːd]'],['fish','рыба','[fɪʃ]']]
.map((w,i)=>({ id:'w'+(i+1), en:w[0], ru:w[1], ipa:w[2], au:'' }));
save('cats', 'example-animals', { name:'Животные (пример)', color:2, createdAt:Date.now(), words });
}
/* старым словам без картинки подбираем эмодзи один раз */
let backfilling = false;
async function backfill(){
if (backfilling) return; backfilling = true;
try{
if (!(await loadEmoji())) return;
for (const [cid, c] of Object.entries(data.cats)){
const need = (c.words||[]).some(w => w.en && !w.pend && w.em === undefined);
if (need) updateCatById(cid, b => { (b.words||[]).forEach(w => { if (w.en && !w.pend && w.em === undefined) w.em = emojiFor(w.en); }); });
}
}finally{ backfilling = false; }
refresh();
}
function init(){
loadQueue();
if (loadLocal()) ready = true;
render();
pull().then(backfill);
if ('serviceWorker' in navigator){
window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').then(r => r.update && r.update()).catch(()=>{}); });
}
}
init();
})();
